<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>المكتبة الرقمية الجامعية</title>
<style>
body {font-family: Arial; margin:0; background:#f5f7fa;}
/* HEADER */
header {
    background:#1e3c72;
    color:white;
    text-align:center;
    padding:20px;
}
/* SEARCH */
.search {
    text-align:center;
    margin:20px;
}
.search input {
    width:60%;
    padding:10px;
}
.search button {
    padding:10px;
}
/* RESULTS */
.result {
    background:white;
    margin:10px auto;
    padding:10px;
    width:80%;
    border-radius:6px;
    box-shadow:0 0 5px rgba(0,0,0,0.1);
}
/* SECTIONS (مخفية بصريًا) */
.hidden-section {
    display:none;
}
/* CHAT BUTTON */
.chatbot-btn {
    position:fixed;
    bottom:20px;
    right:20px;
    background:#2a5298;
    color:white;
    padding:12px;
    border-radius:50px;
    text-decoration:none;
}
</style>
</head>
<body>
<header>
<h1>المكتبة الرقمية الجامعية</h1>
<p>نظام مكتبة ذكي مع استرجاع معلوماتي متقدم</p>
</header>
<!-- 🔍 SEARCH -->
<div class="search">
<input type="text" id="q" placeholder="ابحث في المكتبة...">
<button onclick="search()">بحث</button>
</div>
<div id="results"></div>
<!-- 📚 DATASET -->
<script>
const library = [
{title:"التصنيف في المكتبات ومراكز المعلومات",type:"كتاب",file:"files/books/new_book1.pdf",keywords:"تصنيف فهرسة ديوي"},
{title:"الفهرسة الموضوعية",type:"كتاب",file:"files/books/new_book2.pdf",keywords:"فهرسة مكتبات"},
{title:"الروبوتات الذكية في المكتبات",type:"مقال",file:"files/articles/new_article1.pdf",keywords:"ذكاء اصطناعي روبوت"},
{title:"دور الجامعة في البحث العلمي",type:"مقال",file:"files/articles/new_article2.pdf",keywords:"بحث علمي جامعة"},
{title:"معوقات الرقمنة",type:"ورقة عمل",file:"files/worksheets/new_ws1.pdf",keywords:"رقمنة مكتبات"},
{title:"اللغة والترجمة",type:"ورقة عمل",file:"files/worksheets/new_ws2.pdf",keywords:"لغة ترجمة معلومات"}
];
function search(){
let q = document.getElementById("q").value.toLowerCase();
let resultsDiv = document.getElementById("results");
resultsDiv.innerHTML = "";
// 🔍 بحث ذكي
let res = library.filter(i =>
i.title.toLowerCase().includes(q) ||
i.keywords.toLowerCase().includes(q)
);
if(res.length === 0){
resultsDiv.innerHTML = `
<div class="result">
<p>❌ لا توجد نتائج داخل المكتبة</p>
<p>💡 جرب كلمات: مكتبات، تصنيف، فهرسة، ذكاء اصطناعي</p>
<a class="chatbot-btn" href="https://www.chatbase.co/chatbot/YOUR_ID" target="_blank">
🤖 اسأل أمين المكتبة الذكي
</a>
</div>
`;
return;
}
res.forEach(i=>{
resultsDiv.innerHTML += `
<div class="result">
<h3>${i.title}</h3>
<p>${i.type}</p>
<!-- ✅ زر التحميل الصحيح -->
<a href="${i.file}" download style="
display:inline-block;
margin-top:10px;
padding:8px 12px;
background:#2a5298;
color:white;
text-decoration:none;
border-radius:5px;">
⬇ تحميل الملف
</a>
</div>
`;
});
}
</script>
<!-- 🤖 زر الروبوت -->
<a class="chatbot-btn" href="https://www.chatbase.co/chatbot/YOUR_ID" target="_blank">
🤖 أمين المكتبة الذكي
</a>
</body>
</html>
