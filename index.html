<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام إدارة المكتبة الذكية</title>
<style>
body {font-family: Arial; margin:0; background:#f5f7fa;}
header {
background:#1e3c72;
color:white;
text-align:center;
padding:20px;
}
/* SEARCH */
.search {
text-align:center;
margin:20px;
}
.search input {
width:60%;
padding:10px;
}
/* RESULT */
.result {
background:white;
margin:10px auto;
padding:12px;
width:80%;
border-radius:6px;
box-shadow:0 0 5px rgba(0,0,0,0.1);
}
/* BUTTONS */
.btn {
display:inline-block;
margin-top:8px;
padding:8px 10px;
border-radius:5px;
text-decoration:none;
font-size:13px;
}
.download {background:#2a5298;color:white;}
.chat {background:#444;color:white;margin-right:5px;}
/* DASHBOARD */
.dashboard {
background:white;
width:80%;
margin:20px auto;
padding:15px;
border-radius:8px;
text-align:center;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}
.stat {
font-size:18px;
margin:8px;
}
/* FLOAT BOT */
.bot {
position:fixed;
bottom:20px;
right:20px;
background:#2a5298;
color:white;
padding:12px 18px;
border-radius:50px;
text-decoration:none;
}
</style>
</head>
<body>
<header>
<h1>🏛️ نظام إدارة المكتبة الرقمية الذكية</h1>
<p>مكتبة جامعية + روبوت + تحليلات استخدام</p>
</header>
<!-- 🔍 SEARCH -->
<div class="search">
<input type="text" id="q" placeholder="ابحث في المكتبة...">
<button onclick="search()">بحث</button>
</div>
<!-- 📊 DASHBOARD -->
<div class="dashboard">
<h2>📊 لوحة الإحصائيات</h2>
<div class="stat" id="s1">عمليات البحث: 0</div>
<div class="stat" id="s2">التحميلات: 0</div>
<div class="stat" id="s3">تفاعل الروبوت: 0</div>
</div>
<div id="results"></div>
<script>
const BOT_ID = "KWou9XP";
// ===== INIT STATS =====
function get(key){
return Number(localStorage.getItem(key) || 0);
}
function set(key,val){
localStorage.setItem(key,val);
updateDashboard();
}
// ===== UPDATE DASHBOARD =====
function updateDashboard(){
document.getElementById("s1").innerText = "عمليات البحث: " + get("search");
document.getElementById("s2").innerText = "التحميلات: " + get("download");
document.getElementById("s3").innerText = "تفاعل الروبوت: " + get("bot");
}
updateDashboard();
// ===== TRACK EVENTS =====
function addSearch(){
set("search", get("search")+1);
}
function addDownload(){
set("download", get("download")+1);
}
function addBot(){
set("bot", get("bot")+1);
}
// ===== DATABASE =====
const library = [
{title:"التصنيف في المكتبات ومراكز المعلومات",type:"كتاب",file:"files/books/new_book1.pdf"},
{title:"الفهرسة الموضوعية",type:"كتاب",file:"files/books/new_book2.pdf"},
{title:"الروبوتات الذكية في المكتبات",type:"مقال",file:"files/articles/new_article1.pdf"},
{title:"دور الجامعة في البحث العلمي",type:"مقال",file:"files/articles/new_article2.pdf"},
{title:"معوقات الرقمنة",type:"ورقة عمل",file:"files/worksheets/new_ws1.pdf"},
{title:"اللغة والترجمة",type:"ورقة عمل",file:"files/worksheets/new_ws2.pdf"}
];
// ===== SEARCH ENGINE =====
function search(){
addSearch();
let q = document.getElementById("q").value.toLowerCase();
let results = document.getElementById("results");
results.innerHTML = "";
let found = library.filter(i =>
i.title.toLowerCase().includes(q)
);
if(found.length === 0){
results.innerHTML = `
<div class="result">
<p>❌ لا توجد نتائج داخل المكتبة</p>
<a class="btn chat" href="https://www.chatbase.co/chatbot/${BOT_ID}"
onclick="addBot()" target="_blank">
🤖 اسأل أمين المكتبة الذكي
</a>
</div>
`;
return;
}
found.forEach(i=>{
results.innerHTML += `
<div class="result">
<h3>${i.title}</h3>
<p>${i.type}</p>
<a class="btn download" href="${i.file}" download onclick="addDownload()">
⬇ تحميل الملف
</a>
<a class="btn chat" href="https://www.chatbase.co/chatbot/${BOT_ID}"
onclick="addBot()" target="_blank">
🤖 استشارة الروبوت
</a>
</div>
`;
});
}
</script>
<!-- 🤖 FLOATING BOT -->
<a class="bot" href="https://www.chatbase.co/chatbot/KWou9XP"
onclick="addBot()" target="_blank">
🤖 أمين المكتبة الذكي
</a>
</body>
</html>
